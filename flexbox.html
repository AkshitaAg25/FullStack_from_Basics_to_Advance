<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            height: 90vh;
            outline:3px solid black;
            flex-direction: column;
            /* justify-content:space-between; */
            justify-content: space-evenly;
            align-items: center;
            /* flex-wrap: wrap; */
        }
        .container>div{
            background-color: black;
            color: white;
            height: 100px;
            align-content:center;
            text-align: center;
            width:150px;
            /* flex-grow: 2; */
            /* we can directly write as flex: grow shrink basis i.e, flex: 2 1 150px*/
        }
        #box1{
            flex-basis: 150px;
            background-color: aqua;
        }
        #box2{
            flex-basis: 150px;
            background-color: blue;
            /* flex-grow: 1;
            flex-shrink: 1; */
        }
        #box3{
            flex-basis: 150px;
            /* flex-grow: 2; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
    </div>
</body>
</html>
