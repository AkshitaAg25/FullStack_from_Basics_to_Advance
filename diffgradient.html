<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin-left:300px ;
            width:500px;
            height:100px;
        }
        .box{
            width:500px;
            height:250px;
            margin-bottom: 10px;
        }
        #box1{
            height: 10px;
            border-radius: 20px;
            box-shadow: 0px 0px 20px black;
            background: linear-gradient(337deg,red,orange,black);
            /* background: linear-gradient(to left,red,orange,black); */
        }
        #box2{
            background: radial-gradient(purple,pink,blue);
        }
        #box3{
            background: conic-gradient(red,white,orange);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
    </div>
</body>
</html>
